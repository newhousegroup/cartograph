<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Newhouse Cartograph</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&family=SUSE:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap" />

<style>
*,*::before,*::after{
  box-sizing:border-box;
}

:root{
  --bg:#0b0f1a;
  --canvasBg:#0b0f1a;
  --line:rgba(255,255,255,.6);

  --panel:#141a2b;
  --text:#ffffff;

  --pill:#141a2b;
  --pillText:#ffffff;
  --pillBorder:rgba(255,255,255,.18);
}

html,
body{
  height:100%;
  height:100svh;
  min-height:100svh;
  max-height:100svh;
}

body{
  margin:0;
  min-height:100svh;
  background:var(--bg);
  color:var(--text);
  font-family:'SUSE',system-ui,sans-serif;
  overflow:hidden;
}

button,
input,
textarea{
  font-family:'SUSE',system-ui,sans-serif;
}

header{
  background:#0468fe;
  padding:14px 18px;
  font-weight:800;
  font-size:18px;
}

/* =========================
   QUICK SETUP
========================= */

#topActions{
  max-width:1100px;
  margin:14px auto 0 auto;
  padding:0 16px;

  display:flex;
  justify-content:flex-end;
}

.quickSetupBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  background:#FFD84D;
  color:#111;

  border:none;
  border-radius:12px;

  padding:10px 14px;

  font-weight:800;

  cursor:pointer;
}

.quickSetupBtn:hover{
  filter:brightness(1.03);
}

#quickSetupModal{
  position:fixed;
  inset:0;

  min-height:75svh;

  background:rgba(0,0,0,.55);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:1000;
}

.modalCard{
  width:min(92vw,720px);

  background:#141a2b;

  border:1px solid rgba(255,255,255,.18);

  border-radius:18px;

  padding:18px;
}

.modalTitle{
  font-size:20px;
  font-weight:800;
  margin-bottom:10px;
}

.modalDesc{
  opacity:.72;
  font-size:14px;
  line-height:1.5;
  margin-bottom:14px;
}

#quickSetupInput{
  width:100%;
  min-height:340px;

  resize:vertical;

  border:none;
  outline:none;

  border-radius:14px;

  padding:14px;

  background:#0b0f1a;
  color:white;

  border:1px solid rgba(255,255,255,.18);

  font-size:14px;
  line-height:1.5;

  font-family:monospace;
}

#quickSetupInput::placeholder{
  color:rgba(255,255,255,.35);
}

.modalButtons{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.modalBtn{
  flex:1;

  border:none;
  border-radius:12px;

  padding:12px;

  font-weight:800;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.modalBtnPrimary{
  background:#FFD84D;
  color:#111;
}

.modalBtnSecondary{
  background:#232b45;
  color:white;
}

/* =========================
   MAIN
========================= */

#editor,#mapView{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

#editor{
  min-height:calc(100svh - 58px);
  display:flex;
  flex-direction:column;
}

#tree{
  flex:1;
  overflow:auto;
  padding-bottom:24px;
}

.node{
  margin-left:20px;
  margin-top:10px;
}

.node.collapsed>.children{
  display:none;
}

.nodeBox{
  width:100%;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.nodeBox input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:white;
  font-size:16px;
}

.nodeActions{
  display:flex;
  align-items:center;
  gap:6px;
}

.iconBtn,
.iconBtnOutline{
  width:34px;
  height:34px;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.iconBtn{
  border:none;
  background:#FFD84D;
  color:#111;
}

.iconBtnOutline{
  border:2px solid #FFD84D;
  background:transparent;
  color:#FFD84D;
}

.collapseBtn{
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

.bottomButtons{
  display:flex;
  gap:12px;
  margin-top:14px;
}

.bigBtn{
  flex:1;
  border:none;
  border-radius:14px;
  background:#FFD84D;
  color:#111;
  font-weight:800;
  padding:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

#mapView{
  display:none;
}

#toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.toolbarBtn{
  background:var(--panel);
  color:white;
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}

#toolbar>.toolbarBtn,
#toolbar .menuWrap>.toolbarBtn{
  width:auto;
  min-width:150px;
  min-height:48px;
  justify-content:center;
  padding:10px 18px;
}

#toolbar>.toolbarBtn:first-child{
  min-width:120px;
}

#canvas{
  position:relative;
  background:var(--canvasBg);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:14px;
  min-height:720px;
  margin-top:14px;
  overflow:hidden;
  --mapFont:'SUSE',system-ui,sans-serif;
}

svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.mapNode{
  position:absolute;
  min-width:90px;
  max-width:240px;

  padding:10px 16px;

  border-radius:999px;

  background:var(--pill);
  color:var(--pillText);

  border:1px solid var(--pillBorder);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;

  user-select:none;
  cursor:grab;

  z-index:2;

  font-family:var(--mapFont);
}

.mapNode.dragging{
  cursor:grabbing;
}

.menuWrap{
  position:relative;
}

.menu{
  position:absolute;
  top:110%;
  right:0;

  background:#141a2b;
  border:1px solid rgba(255,255,255,.2);

  border-radius:10px;
  overflow:hidden;

  display:none;

  z-index:100;
  min-width:180px;
}

.menu button{
  width:100%;
  background:#141a2b;
  color:white;
  border:none;
  padding:10px 12px;
  text-align:left;
  cursor:pointer;
}

.menu button:hover{
  background:rgba(255,255,255,.08);
}

#debug{
  display:none;
}

@media(max-width:700px){

  .bottomButtons{
    flex-direction:column;
  }

  .modalButtons{
    flex-direction:column;
  }

  .quickSetupBtn{
    width:100%;
  }

  #toolbar>.toolbarBtn,
  #toolbar .menuWrap>.toolbarBtn{
    width:100%;
  }

  .menuWrap{
    width:100%;
  }

  #canvas{
    min-height:640px;
  }
}
</style>
</head>

<body>

<header>🗺️ Newhouse Cartograph</header>

<div id="topActions">
  <button
    class="quickSetupBtn"
    onclick="openQuickSetup()"
  >
    <span class="material-symbols-rounded">
      auto_awesome
    </span>

    Quick Setup
  </button>
</div>

<div id="editor">
  <div id="tree"></div>

  <div class="bottomButtons">
    <button class="bigBtn" onclick="generateMap('topdown')">
      <span class="material-symbols-rounded">graph_4</span>
      Top Down
    </button>

    <button class="bigBtn" onclick="generateMap('orbital')">
      <span class="material-symbols-rounded">graph_5</span>
      Orbital
    </button>
  </div>
</div>

<div id="mapView">

  <div id="toolbar">

    <button class="toolbarBtn" onclick="backToEditor()">
      ← Back
    </button>

    <div class="menuWrap">
      <button class="toolbarBtn" onclick="toggleMenu('themeMenu')">
        <span class="material-symbols-rounded">palette</span>
        <span id="themeLabel">Dark</span>
      </button>

      <div class="menu" id="themeMenu"></div>
    </div>

    <div class="menuWrap">
      <button class="toolbarBtn" onclick="toggleMenu('bgMenu')">
        <span class="material-symbols-rounded">wallpaper</span>
        <span id="bgLabel">Dark</span>
      </button>

      <div class="menu" id="bgMenu"></div>
    </div>

    <div class="menuWrap">
      <button class="toolbarBtn" onclick="toggleMenu('fontMenu')">
        <span class="material-symbols-rounded">text_fields</span>
        <span id="fontLabel">Default</span>
      </button>

      <div class="menu" id="fontMenu"></div>
    </div>

  </div>

  <div id="canvas">
    <svg id="lines"></svg>
  </div>

  <div id="debug"></div>

</div>

<!-- QUICK SETUP MODAL -->

<div id="quickSetupModal">

  <div class="modalCard">

    <div class="modalTitle">
      Quick Setup
    </div>

    <div class="modalDesc">
      Paste a numbered structure.<br><br>

      Example:<br>
      0. Topic<br>
      1. Main Branch<br>
      1.1. Child<br>
      1.2. Another Child<br>
      1.2.1. Nested Item
    </div>

    <textarea
      id="quickSetupInput"
      placeholder="0. Topic
1. Main Branch
1.1. Child
1.2. Another Child
1.2.1. Nested Item
2. Another Branch"
    ></textarea>

    <div class="modalButtons">

      <button
        class="modalBtn modalBtnSecondary"
        onclick="closeQuickSetup()"
      >
        Cancel
      </button>

      <button
        class="modalBtn modalBtnPrimary"
        onclick="importQuickSetup()"
      >
        <span class="material-symbols-rounded">
          download
        </span>

        Import
      </button>

    </div>

  </div>

</div>

<script>
/* =========================
   CONFIG
========================= */

const THEMES={
  dark:{
    type:'solid',
    pill:'#141a2b',
    text:'#ffffff',
    border:'rgba(255,255,255,.18)'
  },

  light:{
    type:'solid',
    pill:'#ffffff',
    text:'#000000',
    border:'rgba(0,0,0,.25)'
  },

  newhouse:{
    type:'solid',
    pill:'#0468fe',
    text:'#ffffff',
    border:'rgba(255,255,255,.35)'
  },

  glimmer:{
    type:'gradient',
    start:'#0468fe',
    end:'#000000',
    text:'#ffffff',
    border:'rgba(255,255,255,.25)'
  },

  pinkblue:{
    type:'gradient',
    start:'#f7b2d9',
    end:'#b9e3ff',
    text:'#000000',
    border:'rgba(255,255,255,.25)'
  },

  purplegold:{
    type:'gradient',
    start:'#6a2fbf',
    end:'#9b7a1f',
    text:'#ffffff',
    border:'rgba(255,255,255,.25)'
  },

  sunrise:{
    type:'gradient',
    start:'#ffd6a5',
    end:'#ff8fab',
    text:'#000000',
    border:'rgba(255,255,255,.25)'
  },

  sunset:{
    type:'gradient',
    start:'#ff6a00',
    end:'#2b1055',
    text:'#ffffff',
    border:'rgba(255,255,255,.25)'
  },

  pastel:{
    type:'rainbow',
    saturation:60,
    lightness:85,
    text:'#000000'
  },

  rainbow:{
    type:'rainbow',
    saturation:70,
    lightness:40,
    text:'#ffffff'
  }
};

const BACKGROUNDS={
  light:{
    bg:'#ffffff',
    line:'rgba(0,0,0,.6)'
  },

  sepia:{
    bg:'#f4ecd8',
    line:'rgba(60,40,20,.6)'
  },

  blueprint:{
    bg:'#0b1e3d',
    line:'rgba(200,220,255,.6)'
  },

  dark:{
    bg:'#0b0f1a',
    line:'rgba(255,255,255,.6)'
  },

  midnight:{
    bg:'#000000',
    line:'rgba(255,255,255,.8)'
  }
};

const MAP_FONTS={
  default:{
    label:'Default',
    stack:"'SUSE',system-ui,sans-serif"
  },

  inter:{
    label:'Inter',
    stack:"'Inter','SUSE',system-ui,sans-serif"
  },

  ibmplexsans:{
    label:'IBM Plex Sans',
    stack:"'IBM Plex Sans Thai','SUSE',system-ui,sans-serif"
  },

  googlesans:{
    label:'Google Sans',
    stack:"'Google Sans','Product Sans','Roboto','SUSE',system-ui,sans-serif"
  }
};

/* =========================
   STATE
========================= */

let treeData={
  id:1,
  text:'Topic',
  children:[]
};

let positions=[];

let currentLayout='orbital';
let currentTheme='dark';
let currentBackground='dark';
let currentMapFont='default';

const PILL_W=140;
const PILL_H=44;
const MARGIN=26;

let dragNode=null;
let dragOffsetX=0;
let dragOffsetY=0;

/* =========================
   QUICK SETUP
========================= */

function openQuickSetup(){

  document.getElementById(
    'quickSetupModal'
  ).style.display='flex';
}

function closeQuickSetup(){

  document.getElementById(
    'quickSetupModal'
  ).style.display='none';
}

function importQuickSetup(){

  const raw=
    document.getElementById(
      'quickSetupInput'
    ).value;

  const lines=
    raw
      .split('\n')
      .map(l=>l.trim())
      .filter(Boolean);

  if(lines.length===0){

    alert('No content found.');

    return;
  }

  const map={};

  let root=null;

  try{

    for(const line of lines){

      const match=
        line.match(/^([\d\.]+)\s+(.*)$/);

      if(!match) continue;

      const numbering=
        match[1].replace(/\.$/,'');

      const text=
        match[2].trim();

      const parts=
        numbering
          .split('.')
          .filter(Boolean);

      const node={
        id:Date.now()+Math.random(),
        text,
        children:[]
      };

      map[numbering]=node;

      if(numbering==='0'){

        root=node;

        continue;
      }

      const parentKey=
        parts.length===1
          ? '0'
          : parts.slice(0,-1).join('.');

      const parent=
        map[parentKey];

      if(parent){

        parent.children.push(node);
      }
    }

    if(!root){

      alert(
        'Missing root topic (0. Topic)'
      );

      return;
    }

    treeData=root;

    renderTree();

    closeQuickSetup();

  }catch(err){

    console.error(err);

    alert('Import failed.');
  }
}

/* =========================
   TREE
========================= */

function createNode(text='New node'){
  return {
    id:Date.now()+Math.random(),
    text,
    children:[]
  };
}

function findNode(node,id){
  if(node.id===id) return node;

  for(const child of node.children){
    const found=findNode(child,id);
    if(found) return found;
  }

  return null;
}

function deleteNode(id,parent=treeData){
  parent.children=parent.children.filter(c=>c.id!==id);

  parent.children.forEach(c=>{
    deleteNode(id,c);
  });
}

function addChild(id){
  const node=findNode(treeData,id);

  if(!node) return;

  node.children.push(createNode());

  renderTree();
}

/* =========================
   TREE RENDER
========================= */

function renderTree(){
  const tree=document.getElementById('tree');

  tree.innerHTML='';

  tree.appendChild(renderNode(treeData,true));
}

function renderNode(node,isRoot=false){

  const div=document.createElement('div');
  div.className='node';

  const box=document.createElement('div');
  box.className='nodeBox';

  const input=document.createElement('input');

  input.value=node.text;

  input.oninput=e=>{
    node.text=e.target.value;
  };

  const actions=document.createElement('div');
  actions.className='nodeActions';

  const add=document.createElement('button');

  add.className='iconBtn';

  add.innerHTML=
    '<span class="material-symbols-rounded">add</span>';

  add.onclick=()=>{
    addChild(node.id);
  };

  actions.appendChild(add);

  if(!isRoot){

    const del=document.createElement('button');

    del.className='iconBtn';

    del.innerHTML=
      '<span class="material-symbols-rounded">delete</span>';

    del.onclick=()=>{
      deleteNode(node.id);
      renderTree();
    };

    actions.appendChild(del);
  }

  if(isRoot){

    const wrap=document.createElement('div');
    wrap.className='menuWrap';

    const btn=document.createElement('button');

    btn.className='iconBtnOutline';

    btn.innerHTML=
      '<span class="material-symbols-rounded">folder</span>';

    btn.onclick=()=>{
      toggleMenu('fileMenu');
    };

    const menu=document.createElement('div');

    menu.className='menu';
    menu.id='fileMenu';

    menu.innerHTML=`
      <button onclick="openCarto()">Open...</button>
      <button onclick="saveCarto()">Save...</button>
    `;

    wrap.appendChild(btn);
    wrap.appendChild(menu);

    actions.appendChild(wrap);
  }

  const collapse=document.createElement('button');

  collapse.className=
    'collapseBtn material-symbols-rounded';

  collapse.textContent='expand_more';

  collapse.onclick=()=>{

    const collapsed=
      div.classList.toggle('collapsed');

    collapse.textContent=
      collapsed
        ? 'chevron_right'
        : 'expand_more';
  };

  box.appendChild(input);
  box.appendChild(actions);
  box.appendChild(collapse);

  div.appendChild(box);

  const children=document.createElement('div');
  children.className='children';

  node.children.forEach(child=>{
    children.appendChild(
      renderNode(child,false)
    );
  });

  div.appendChild(children);

  return div;
}

/* =========================
   MENUS
========================= */

function toggleMenu(id){

  const menu=document.getElementById(id);

  if(!menu) return;

  const open=
    menu.style.display==='block';

  document.querySelectorAll('.menu')
    .forEach(m=>{
      m.style.display='none';
    });

  menu.style.display=
    open ? 'none' : 'block';
}

document.addEventListener('click',e=>{

  if(!e.target.closest('.menuWrap')){

    document.querySelectorAll('.menu')
      .forEach(m=>{
        m.style.display='none';
      });
  }
});

/* =========================
   FILES
========================= */

function saveCarto(){

  const clean=(treeData.text || 'MAP')
    .replace(/[^A-Z0-9]/gi,'')
    .toUpperCase()
    .slice(0,8);

  const d=new Date();

  const date=
    d.getFullYear()+
    String(d.getMonth()+1).padStart(2,'0')+
    String(d.getDate()).padStart(2,'0');

  const filename=
    `${date}_${clean || 'MAP'}.carto`;

  const blob=new Blob(
    [JSON.stringify(treeData,null,2)],
    {type:'application/json'}
  );

  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);
  a.download=filename;

  a.click();
}

function openCarto(){

  const input=document.createElement('input');

  input.type='file';
  input.accept='.carto';

  input.onchange=e=>{

    const file=e.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{

      try{

        const parsed=
          JSON.parse(reader.result);

        if(!parsed || typeof parsed!=='object'){
          throw new Error();
        }

        treeData=parsed;

        renderTree();

      }catch(err){

        alert('Invalid .carto file');
      }
    };

    reader.readAsText(file);
  };

  input.click();
}

/* =========================
   VIEW
========================= */

function generateMap(mode){

  currentLayout=mode;

  document.getElementById('editor')
    .style.display='none';

  document.getElementById('mapView')
    .style.display='block';

  document.getElementById('topActions')
    .style.display='none';

  drawMap();
}

function backToEditor(){

  document.getElementById('mapView')
    .style.display='none';

  document.getElementById('editor')
    .style.display='flex';

  document.getElementById('topActions')
    .style.display='flex';
}

/* =========================
   LAYOUT
========================= */

function getCanvasSize(){

  const canvas=
    document.getElementById('canvas');

  return {
    w:canvas.clientWidth || 1000,
    h:canvas.clientHeight || 720
  };
}

function clamp(x,y){

  const {w,h}=getCanvasSize();

  return {
    x:Math.max(
      MARGIN,
      Math.min(w-PILL_W-MARGIN,x)
    ),

    y:Math.max(
      MARGIN,
      Math.min(h-PILL_H-MARGIN,y)
    )
  };
}

function pushPosition(node,x,y,parent=null,depth=0){

  const p=clamp(
    x-PILL_W/2,
    y-PILL_H/2
  );

  positions.push({
    node,
    x:p.x,
    y:p.y,
    parent,
    depth
  });

  return positions[positions.length-1];
}

/* ===== ORBITAL ===== */

function layoutOrbitalRoot(){

  const {w,h}=getCanvasSize();

  const root=
    pushPosition(
      treeData,
      w/2,
      h/2,
      null,
      0
    );

  const children=treeData.children;

  if(children.length===0) return;

  const step=
    (Math.PI*2)/children.length;

  children.forEach((child,index)=>{

    const angle=
      -Math.PI/2 + step*index;

    orbitalBranch(
      child,
      root,
      angle,
      220,
      1
    );
  });
}

function orbitalBranch(
  node,
  parentPos,
  angle,
  radius,
  depth
){

  const variance=
    (Math.random()-.5)*0.28;

  const a=angle+variance;

  const cx=
    parentPos.x+PILL_W/2+
    Math.cos(a)*radius;

  const cy=
    parentPos.y+PILL_H/2+
    Math.sin(a)*radius;

  const current=
    pushPosition(
      node,
      cx,
      cy,
      parentPos,
      depth
    );

  avoidOverlap(current);

  const children=node.children;

  if(children.length===0) return;

  const spread=
    Math.max(
      0.5,
      1.7-(depth*0.12)
    );

  children.forEach((child,index)=>{

    const offset=
      children.length===1
        ? 0
        : ((index/(children.length-1))-.5)
          * spread;

    orbitalBranch(
      child,
      current,
      a+offset,
      Math.max(145,210-(depth*12)),
      depth+1
    );
  });
}

/* ===== TOP DOWN ===== */

function layoutTopDown(){

  const {w}=getCanvasSize();

  topDownBranch(
    treeData,
    w/2,
    90,
    300,
    null,
    0
  );
}

function topDownBranch(
  node,
  x,
  y,
  spread,
  parent,
  depth
){

  const current=
    pushPosition(
      node,
      x,
      y,
      parent,
      depth
    );

  avoidOverlap(current);

  const children=node.children;

  if(children.length===0) return;

  const nextSpread=
    Math.max(110,spread*0.72);

  children.forEach((child,index)=>{

    const nx=
      x
      -(nextSpread*(children.length-1)/2)
      +(index*nextSpread);

    const ny=
      y+118;

    topDownBranch(
      child,
      nx,
      ny,
      nextSpread,
      current,
      depth+1
    );
  });
}

/* =========================
   OVERLAP
========================= */

function intersects(a,b){

  return !(
    a.x+PILL_W < b.x ||
    a.x > b.x+PILL_W ||
    a.y+PILL_H < b.y ||
    a.y > b.y+PILL_H
  );
}

function avoidOverlap(target){

  let attempts=0;

  while(attempts<40){

    let hit=false;

    for(const other of positions){

      if(other===target) continue;

      if(intersects(target,other)){

        target.y+=58;

        hit=true;
      }
    }

    if(!hit) break;

    attempts++;
  }

  const clamped=
    clamp(target.x,target.y);

  target.x=clamped.x;
  target.y=clamped.y;
}

/* =========================
   DRAW
========================= */

function drawMap(){

  positions=[];

  const canvas=
    document.getElementById('canvas');

  canvas.innerHTML=
    '<svg id="lines"></svg>';

  if(currentLayout==='topdown'){
    layoutTopDown();
  }else{
    layoutOrbitalRoot();
  }

  positions.forEach((p,index)=>{

    const el=document.createElement('div');

    el.className='mapNode';

    el.textContent=
      p.node.text || 'Untitled';

    el.style.left=p.x+'px';
    el.style.top=p.y+'px';

    el.dataset.index=index;

    attachDragging(el,p);

    canvas.appendChild(el);
  });

  applyBackground();
  applyTheme();
  applyMapFont();

  redrawLines();

  updateDebug();
}

/* =========================
   DRAGGING
========================= */

function attachDragging(el,pos){

  function start(clientX,clientY){

    dragNode={el,pos};

    dragOffsetX=
      clientX-pos.x;

    dragOffsetY=
      clientY-pos.y;

    el.classList.add('dragging');
  }

  el.addEventListener('mousedown',e=>{
    start(e.clientX,e.clientY);
  });

  el.addEventListener('touchstart',e=>{

    const t=e.touches[0];

    start(t.clientX,t.clientY);

  },{passive:true});
}

document.addEventListener('mousemove',moveDrag);
document.addEventListener('touchmove',touchMove,{passive:false});

function moveDrag(e){

  if(!dragNode) return;

  updateDrag(e.clientX,e.clientY);
}

function touchMove(e){

  if(!dragNode) return;

  e.preventDefault();

  const t=e.touches[0];

  updateDrag(t.clientX,t.clientY);
}

function getDragGroup(rootPos){

  return [
    rootPos,
    ...positions.filter(p=>isDescendant(p,rootPos))
  ];
}

function clampDeltaAxis(delta,minPos,maxPos,minAllowed,maxAllowed){

  const lower=
    minAllowed-minPos;

  const upper=
    maxAllowed-maxPos;

  if(lower>upper){
    return 0;
  }

  return Math.max(
    lower,
    Math.min(upper,delta)
  );
}

function clampDragDelta(group,dx,dy){

  const {w,h}=getCanvasSize();

  const minX=
    Math.min(...group.map(p=>p.x));

  const maxX=
    Math.max(...group.map(p=>p.x));

  const minY=
    Math.min(...group.map(p=>p.y));

  const maxY=
    Math.max(...group.map(p=>p.y));

  dx=clampDeltaAxis(
    dx,
    minX,
    maxX,
    MARGIN,
    w-PILL_W-MARGIN
  );

  dy=clampDeltaAxis(
    dy,
    minY,
    maxY,
    MARGIN,
    h-PILL_H-MARGIN
  );

  return {dx,dy};
}

function updateDrag(clientX,clientY){

  const pos=dragNode.pos;

  const targetX=
    clientX-dragOffsetX;

  const targetY=
    clientY-dragOffsetY;

  let dx=
    targetX-pos.x;

  let dy=
    targetY-pos.y;

  const group=
    getDragGroup(pos);

  const delta=
    clampDragDelta(group,dx,dy);

  dx=delta.dx;
  dy=delta.dy;

  group.forEach(p=>{

    p.x+=dx;
    p.y+=dy;

    const index=
      positions.indexOf(p);

    const el=
      document.querySelector(
        `.mapNode[data-index="${index}"]`
      );

    if(el){

      el.style.left=p.x+'px';
      el.style.top=p.y+'px';
    }
  });

  redrawLines();
}

document.addEventListener('mouseup',endDrag);
document.addEventListener('touchend',endDrag);

function endDrag(){

  if(!dragNode) return;

  dragNode.el.classList.remove('dragging');

  dragNode=null;
}

/* =========================
   LINES
========================= */

function redrawLines(){

  const svg=
    document.getElementById('lines');

  if(!svg) return;

  svg.innerHTML='';

  const canvasRect=
    document.getElementById('canvas')
      .getBoundingClientRect();

  const nodeEls=
    [...document.querySelectorAll('.mapNode')];

  positions.forEach((p,index)=>{

    if(!p.parent) return;

    const parentIndex=
      positions.indexOf(p.parent);

    if(parentIndex<0) return;

    const a=
      nodeEls[parentIndex]
        .getBoundingClientRect();

    const b=
      nodeEls[index]
        .getBoundingClientRect();

    const line=
      document.createElementNS(
        'http://www.w3.org/2000/svg',
        'line'
      );

    line.setAttribute(
      'x1',
      a.left+a.width/2-canvasRect.left
    );

    line.setAttribute(
      'y1',
      a.top+a.height/2-canvasRect.top
    );

    line.setAttribute(
      'x2',
      b.left+b.width/2-canvasRect.left
    );

    line.setAttribute(
      'y2',
      b.top+b.height/2-canvasRect.top
    );

    line.setAttribute(
      'stroke',
      'var(--line)'
    );

    line.setAttribute(
      'stroke-width',
      '2'
    );

    svg.appendChild(line);
  });
}

/* =========================
   THEMES
========================= */

function applyTheme(){

  const theme=
    THEMES[currentTheme];

  const nodes=
    [...document.querySelectorAll('.mapNode')];

  if(theme.type==='solid'){

    nodes.forEach(el=>{

      el.style.background=
        theme.pill;

      el.style.color=
        theme.text;

      el.style.borderColor=
        theme.border;
    });

    return;
  }

  if(theme.type==='gradient'){

    const roots=[
      positions[0],
      ...positions.filter(
        p=>p.parent===positions[0]
      )
    ];

    roots.forEach((root,index)=>{

      const t=
        roots.length<=1
          ? 0
          : index/(roots.length-1);

      const bg=
        mixColor(
          theme.start,
          theme.end,
          t
        );

      applyBranchColor(
        root,
        bg,
        theme.text,
        theme.border
      );
    });

    return;
  }

  if(theme.type==='rainbow'){

    const roots=[
      positions[0],
      ...positions.filter(
        p=>p.parent===positions[0]
      )
    ];

    roots.forEach((root,index)=>{

      const hue=
        (index/Math.max(1,roots.length))
        *360;

      const bg=
        `hsl(
          ${hue},
          ${theme.saturation}%,
          ${theme.lightness}%
        )`;

      applyBranchColor(
        root,
        bg,
        theme.text,
        bg
      );
    });
  }
}

function applyBranchColor(
  root,
  bg,
  text,
  border
){

  const nodeEls=
    [...document.querySelectorAll('.mapNode')];

  positions.forEach((p,index)=>{

    if(
      p===root ||
      isDescendant(p,root)
    ){

      nodeEls[index].style.background=bg;
      nodeEls[index].style.color=text;

      nodeEls[index].style.border=
        `1px solid ${border}`;
    }
  });
}

function isDescendant(node,root){

  let p=node.parent;

  while(p){

    if(p===root) return true;

    p=p.parent;
  }

  return false;
}

function mixColor(a,b,t){

  const ar=parseInt(a.slice(1,3),16);
  const ag=parseInt(a.slice(3,5),16);
  const ab=parseInt(a.slice(5,7),16);

  const br=parseInt(b.slice(1,3),16);
  const bg=parseInt(b.slice(3,5),16);
  const bb=parseInt(b.slice(5,7),16);

  const r=Math.round(ar+(br-ar)*t);
  const g=Math.round(ag+(bg-ag)*t);
  const bl=Math.round(ab+(bb-ab)*t);

  return `rgb(${r},${g},${bl})`;
}

/* =========================
   BACKGROUNDS
========================= */

function applyBackground(){

  const bg=
    BACKGROUNDS[currentBackground];

  document.documentElement
    .style.setProperty('--canvasBg',bg.bg);

  document.documentElement
    .style.setProperty('--line',bg.line);
}

/* =========================
   MAP FONT
========================= */

function applyMapFont(){

  const font=
    MAP_FONTS[currentMapFont];

  document.getElementById('canvas')
    .style.setProperty('--mapFont',font.stack);
}

/* =========================
   MENUS INIT
========================= */

function buildMenus(){

  const themeMenu=
    document.getElementById('themeMenu');

  const bgMenu=
    document.getElementById('bgMenu');

  const fontMenu=
    document.getElementById('fontMenu');

  themeMenu.innerHTML='';
  bgMenu.innerHTML='';
  fontMenu.innerHTML='';

  Object.keys(THEMES).forEach(key=>{

    const btn=document.createElement('button');

    btn.textContent=
      capitalize(key);

    btn.onclick=()=>{

      currentTheme=key;

      document.getElementById('themeLabel')
        .textContent=capitalize(key);

      applyTheme();

      closeMenus();
    };

    themeMenu.appendChild(btn);
  });

  Object.keys(BACKGROUNDS).forEach(key=>{

    const btn=document.createElement('button');

    btn.textContent=
      capitalize(key);

    btn.onclick=()=>{

      currentBackground=key;

      document.getElementById('bgLabel')
        .textContent=capitalize(key);

      applyBackground();

      redrawLines();

      closeMenus();
    };

    bgMenu.appendChild(btn);
  });

  Object.keys(MAP_FONTS).forEach(key=>{

    const btn=document.createElement('button');

    btn.textContent=
      MAP_FONTS[key].label;

    btn.onclick=()=>{

      currentMapFont=key;

      document.getElementById('fontLabel')
        .textContent=MAP_FONTS[key].label;

      applyMapFont();

      redrawLines();

      closeMenus();
    };

    fontMenu.appendChild(btn);
  });
}

function closeMenus(){

  document.querySelectorAll('.menu')
    .forEach(m=>{
      m.style.display='none';
    });
}

function capitalize(str){

  return str.charAt(0).toUpperCase()
    + str.slice(1);
}

/* =========================
   DEBUG
========================= */

function updateDebug(){

  document.getElementById('debug')
    .textContent=
      `Mode: ${currentLayout}
       • Theme: ${capitalize(currentTheme)}
       • Background: ${capitalize(currentBackground)}
       • Font: ${MAP_FONTS[currentMapFont].label}
       • Nodes: ${positions.length}`;
}

/* =========================
   TESTS
========================= */

function runTests(){

  console.assert(
    typeof generateMap==='function',
    'generateMap exists'
  );

  console.assert(
    typeof applyTheme==='function',
    'applyTheme exists'
  );

  console.assert(
    typeof redrawLines==='function',
    'redrawLines exists'
  );

  console.assert(
    typeof importQuickSetup==='function',
    'importQuickSetup exists'
  );

  console.assert(
    typeof applyMapFont==='function',
    'applyMapFont exists'
  );

  console.assert(
    Object.keys(THEMES).length===10,
    'all themes exist'
  );

  console.assert(
    Object.keys(BACKGROUNDS).length===5,
    'all backgrounds exist'
  );

  console.assert(
    Object.keys(MAP_FONTS).length===4,
    'all map fonts exist'
  );
}

/* =========================
   INIT
========================= */

buildMenus();

renderTree();

runTests();

window.addEventListener('resize',()=>{

  if(
    document.getElementById('mapView')
      .style.display==='block'
  ){
    drawMap();
  }
});
</script>
